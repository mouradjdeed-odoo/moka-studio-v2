# Builds the site as static HTML and uploads it to IONOS Webhosting (folder "public",
# served at https://moka-objektservice.de).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD   SFTP access from the IONOS panel
#   SITE_PASSWORD                                            while set, the whole site asks for a
#                                                            password (user "moka") and is hidden
#                                                            from search engines.
# To launch publicly: delete SITE_PASSWORD and add the repository *variable* SITE_PUBLIC = true.
# Without either, the deploy stops, so the site can never go public by accident.
name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

env:
  SITE_URL: https://moka-objektservice.de
  REMOTE_DIR: public
  SITE_USER: moka

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the SFTP secrets are set
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::IONOS_SFTP_HOST, IONOS_SFTP_USER and IONOS_SFTP_PASSWORD must be set as repository secrets."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build static site
        run: |
          bun install --frozen-lockfile
          STATIC_EXPORT=1 bun run build
          test -f .output/public/index.html
          rm -f .output/public/_headers   # Cloudflare-only file

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp apache2-utils

      - name: Prepare access rules
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          mkdir -p deploy-meta
          if [ -n "$SITE_PASSWORD" ]; then
            echo "PRIVATE=1" >> "$GITHUB_ENV"
            htpasswd -nbB "$SITE_USER" "$SITE_PASSWORD" > deploy-meta/.htpasswd
            printf 'User-agent: *\nDisallow: /\n' > .output/public/robots.txt
          elif [ "${{ vars.SITE_PUBLIC }}" = "true" ]; then
            echo "PRIVATE=0" >> "$GITHUB_ENV"
          else
            echo "::error::Set the secret SITE_PASSWORD (private preview) or the variable SITE_PUBLIC=true (launch)."
            exit 1
          fi

      - name: Upload site
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30;
            mkdir -p $REMOTE_DIR;
            mirror -R --delete --parallel=4 --exclude-glob .htaccess --exclude-glob .htpasswd .output/public $REMOTE_DIR;
            bye"

      - name: Find the folder's server path (needed for the password file)
        if: env.PRIVATE == '1'
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          probe="path-${{ github.run_id }}-${{ github.run_attempt }}.php"
          echo '<?php echo __DIR__;' > "deploy-meta/$probe"
          lftp --env-password -u "$USER" "sftp://$HOST" -e "set sftp:auto-confirm yes; put deploy-meta/$probe -o $REMOTE_DIR/$probe; bye"
          # An earlier deploy may already protect the site, so send the credentials too.
          dir=$(curl -fsS -u "$SITE_USER:$SITE_PASSWORD" "$SITE_URL/$probe" || true)
          lftp --env-password -u "$USER" "sftp://$HOST" -e "set sftp:auto-confirm yes; rm -f $REMOTE_DIR/$probe; bye"
          case "$dir" in
            /*) echo "SITE_DIR=$dir" >> "$GITHUB_ENV" ;;
            *) echo "::error::Could not determine the server path (got: $dir)"; exit 1 ;;
          esac

      - name: Write .htaccess
        run: |
          {
            echo "# Generated by .github/workflows/deploy-ionos.yml. Do not edit on the server."
            echo "Options -Indexes"
            echo "RewriteEngine On"
            echo "RewriteCond %{HTTPS} !=on"
            echo "RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]"
            echo "RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]"
            echo "RewriteRule ^ https://%1%{REQUEST_URI} [L,R=301]"
            echo "<IfModule mod_headers.c>"
            echo "  <FilesMatch \"\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$\">"
            echo "    Header set Cache-Control \"public, max-age=604800\""
            echo "  </FilesMatch>"
            if [ "$PRIVATE" = "1" ]; then
              echo "  Header always set X-Robots-Tag \"noindex, nofollow\""
            fi
            echo "</IfModule>"
            if [ "$PRIVATE" = "1" ]; then
              echo "AuthType Basic"
              echo "AuthName \"MOKA Objektservice\""
              echo "AuthUserFile $SITE_DIR/.htpasswd"
              echo "Require valid-user"
            fi
          } > deploy-meta/.htaccess
          cat deploy-meta/.htaccess

      - name: Upload access rules
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
        run: |
          if [ "$PRIVATE" = "1" ]; then
            cmds="put deploy-meta/.htpasswd -o $REMOTE_DIR/.htpasswd;"
          else
            cmds="rm -f $REMOTE_DIR/.htpasswd;"
          fi
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            $cmds
            put deploy-meta/.htaccess -o $REMOTE_DIR/.htaccess;
            bye"

      - name: Check the live site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ "$PRIVATE" = "1" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            [ "$code" = "401" ] || { echo "::error::Expected 401 without password, got $code"; exit 1; }
            curl -fsS -u "$SITE_USER:$SITE_PASSWORD" "$SITE_URL/" | grep -q "MOKA" || { echo "::error::Site did not load with password"; exit 1; }
            echo "Site is online and password-protected."
          else
            curl -fsS "$SITE_URL/" | grep -q "MOKA" || { echo "::error::Site did not load"; exit 1; }
            echo "Site is online and public."
          fi
